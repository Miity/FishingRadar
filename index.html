<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishingRadar</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb; --card: #ffffff; --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --grid: #e6e5e1; --series: #2a78d6; --wash: rgba(42, 120, 214, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1a1a19; --card: #232321; --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
      --grid: #36352f; --series: #3987e5; --wash: rgba(57, 135, 229, .14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1a19; --card: #232321; --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --grid: #36352f; --series: #3987e5; --wash: rgba(57, 135, 229, .14);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  form { display: flex; gap: 8px; }
  input, button { font: inherit; color: inherit; }
  input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--grid); border-radius: 8px; background: var(--card); }
  button { padding: 8px 12px; border: 1px solid var(--grid); border-radius: 8px; background: var(--card); cursor: pointer; }
  #results { list-style: none; margin: 4px 0 0; padding: 0; }
  #results button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--grid); border-radius: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  #place { font-weight: 600; }
  .seg button[aria-pressed="true"] { border-color: var(--series); background: var(--wash); }
  #days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .day { flex: 0 0 64px; display: grid; justify-items: center; gap: 2px; padding: 8px 4px; }
  .day.sel { border-color: var(--series); background: var(--wash); }
  .wd { font-size: 12px; color: var(--text-2); }
  .dn { font-size: 13px; color: var(--muted); }
  .sc { font-size: 18px; font-weight: 600; }
  .bar { width: 8px; height: 28px; display: flex; align-items: flex-end; background: var(--grid); border-radius: 4px; }
  .bar i { display: block; width: 100%; background: var(--series); border-radius: 4px; }
  .hero { display: flex; align-items: baseline; gap: 12px; margin: 16px 0 4px; }
  .big { font-size: 48px; font-weight: 700; }
  .stars { color: var(--text-2); letter-spacing: 2px; }
  .sub { color: var(--text-2); }
  .chart { position: relative; margin: 8px 0; }
  svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  svg text { fill: var(--muted); font-size: 11px; }
  #tip { position: absolute; top: 0; pointer-events: none; background: var(--card); border: 1px solid var(--grid);
         border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--grid); text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  #status, footer { color: var(--text-2); font-size: 13px; }
  details { margin-top: 12px; }
  .warn { margin: 8px 0; padding: 8px 10px; border: 1px solid var(--grid); border-left: 3px solid var(--text-2); border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FishingRadar</h1>
  <form id="search">
    <input id="q" placeholder="Місто, узбережжя чи водойма" autocomplete="off">
    <button>Знайти</button>
    <button type="button" id="geo" title="Моє місце" aria-label="Моє місце">📍</button>
  </form>
  <ul id="results"></ul>
  <div class="row">
    <span id="place"></span>
    <span class="seg"><button data-mode="sea">Море</button> <button data-mode="fresh">Прісна вода</button> <button data-mode="spear">Підвода</button></span>
  </div>
  <nav id="days"></nav>
  <main id="detail"></main>
  <p id="status"></p>
  <footer>Оцінка умов, а не ймовірність улову. Море / прісна вода: температура води, світанок і захід, хвилі, вітер, рух води, фаза Місяця.
    Підвода: лише світловий день; ранок, безпечна хвиля й вітер, каламуть від хвиль за останні дні, температура, вихідні. Дані: Open-Meteo.</footer>
</div>
<script type="module">
import { MODEL, hourlyScores, dailyScores, moonPhase, label, stars } from './score.js';

const HOUR = 3600e3, DAYS = 10;
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let place = store.get('place', { name: 'Gaeta, Lazio', lat: 41.2138, lon: 13.5713 });
let mode = store.get('mode', 'sea');
let data, daily = [], selected = 0, nowLocal = 0;

const api = (host, path, params) => `https://${host}/v1/${path}?${new URLSearchParams(params)}`;
const getJson = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); };
const ms = (s) => Date.parse(s + 'Z');
const hh = (t) => String(new Date(t).getUTCHours()).padStart(2, '0') + ':00';
const fmt = (v, unit, d = 1) => (v == null ? '—' : v.toFixed(d) + unit);
const status = (s) => ($('#status').textContent = s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
const MOON = ['молодик', 'молодий серп', 'перша чверть', 'зростаючий', 'повня', 'спадний', 'остання чверть', 'старий серп'];
const FACTORS = {
  light: 'Світанок / захід', temp: 'Температура води', waves: 'Хвилі', wind: 'Вітер', water: 'Рух води', moon: 'Фаза Місяця',
  turbidity: 'Каламуть від хвиль', weekend: 'Вихідні',
};

async function load() {
  status('Завантаження…');
  $('#place').textContent = place.name;
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  try {
    const common = { latitude: place.lat, longitude: place.lon, timezone: 'auto', past_days: 3, forecast_days: DAYS };
    const [fc, marine] = await Promise.all([
      getJson(api('api.open-meteo.com', 'forecast', { ...common, hourly: 'temperature_2m,wind_speed_10m', daily: 'sunrise,sunset', wind_speed_unit: 'ms' })),
      mode !== 'fresh'
        ? getJson(api('marine-api.open-meteo.com', 'marine', { ...common, hourly: 'sea_surface_temperature,wave_height,wave_period,sea_level_height_msl' })).catch(() => null)
        : null,
    ]);
    const idx = new Map((marine?.hourly?.time ?? []).map((s, i) => [s, i]));
    const fromMarine = (k) => fc.hourly.time.map((s) => marine?.hourly?.[k]?.[idx.get(s)] ?? null);
    data = {
      time: fc.hourly.time.map(ms),
      utcOffsetMs: fc.utc_offset_seconds * 1000,
      airTemp: fc.hourly.temperature_2m,
      wind: fc.hourly.wind_speed_10m,
      sst: fromMarine('sea_surface_temperature'),
      wave: fromMarine('wave_height'),
      period: fromMarine('wave_period'),
      seaLevel: fromMarine('sea_level_height_msl'),
      sunrise: fc.daily.sunrise.map(ms),
      sunset: fc.daily.sunset.map(ms),
    };
    nowLocal = Date.now() + data.utcOffsetMs;
    const today = new Date(nowLocal).toISOString().slice(0, 10);
    const best = mode === 'spear' ? MODEL.spear.bestHours : MODEL.bestHours;
    daily = dailyScores(hourlyScores(data, mode), best).filter((d) => d.day >= today).slice(0, DAYS);
    selected = 0;
    const noSea = mode !== 'fresh' && data.sst.every((v) => v == null) && data.wave.every((v) => v == null);
    status(noSea ? 'Морських даних для цієї точки немає: хвилі й рух води не враховано, температура води — за повітрям.' : '');
    render();
  } catch (e) {
    status(`Не вдалося отримати дані: ${e.message}`);
  }
}

function render() {
  $('#days').innerHTML = daily.map((d, i) => {
    const dt = new Date(d.day + 'T00:00Z');
    const wd = i === 0 ? 'Сьогодні' : dt.toLocaleDateString('uk', { weekday: 'short', timeZone: 'UTC' });
    return `<button class="day${i === selected ? ' sel' : ''}" data-i="${i}" aria-label="${wd} ${dt.getUTCDate()}: ${d.score}">
      <span class="wd">${wd}</span><span class="dn">${dt.getUTCDate()}</span><span class="sc">${d.score}</span>
      <span class="bar"><i style="height:${d.score}%"></i></span></button>`;
  }).join('');
  const d = daily[selected];
  if (!d) return;
  const best = d.hours.reduce((a, h) => (h.score > a.score ? h : a));
  const phase = moonPhase(d.hours[12 % d.hours.length].t - data.utcOffsetMs);
  $('#detail').innerHTML = `
    <div class="hero"><span class="big">${d.score}</span>
      <span><span class="stars">${'★'.repeat(stars(d.score))}${'☆'.repeat(4 - stars(d.score))}</span><br>
      <span class="sub">${label(d.score)} активність · Місяць: ${MOON[Math.round(phase * 8) % 8]}</span></span></div>
    <div class="sub">Найкращий час: ${windows(d.hours).join(', ')}</div>
    ${riseWarning(d.hours)}
    <div class="chart">${chart(d.hours)}<div id="tip"></div></div>
    <table id="factors"></table>
    <details><summary>Таблиця по годинах</summary><table>
      <tr><th>Година</th><th>Оцінка</th><th>Вода</th><th>Вітер</th><th>Хвилі</th></tr>
      ${d.hours.map((h) => { const r = raw(h.t); return `<tr><td>${hh(h.t)}</td><td>${h.score}</td><td>${fmt(h.waterTemp, '°')}</td><td>${fmt(r.wind, ' м/с')}</td><td>${fmt(r.wave, ' м')}</td></tr>`; }).join('')}
    </table></details>`;
  showFactors(best);
  bindHover(d.hours);
}

const raw = (t) => { const i = data.time.indexOf(t); return { wind: data.wind[i], wave: data.wave[i] }; };

function riseWarning(hs) {
  const h = hs.find((x) => !x.night && x.rise >= MODEL.spear.riseWarn);
  return h ? `<p class="warn">⚠ Хвиля зростає: +${h.rise.toFixed(1)} м за 3 год від ${hh(h.t)}. Не заходьте у воду на підйомі хвилі.</p>` : '';
}

function windows(hs) {
  const max = Math.max(...hs.map((h) => h.score)), cut = 0.85 * max, out = [];
  if (max === 0) return ['умови непридатні'];
  for (const h of hs) {
    if (h.score < cut) continue;
    const last = out.at(-1);
    if (last && h.t - last.end === HOUR) last.end = h.t;
    else out.push({ start: h.t, end: h.t });
  }
  return out.map((w) => `${hh(w.start)}–${hh(w.end + HOUR)}`);
}

function showFactors(h) {
  const r = raw(h.t);
  const extra = {
    temp: fmt(h.waterTemp, ' °C'), waves: fmt(r.wave, ' м'), wind: fmt(r.wind, ' м/с'),
    turbidity: h.ub == null ? '' : `дно ${h.ub.toFixed(2)} м/с`,
  };
  const names = { ...FACTORS, ...(mode === 'spear' && { light: 'Ранок' }) };
  $('#factors').innerHTML = `<tr><th>${hh(h.t)} · оцінка ${h.score}${h.night ? ' (ніч: заборонено)' : ''}</th><th></th><th>Множник</th></tr>` +
    Object.keys(h.f).map((k) => `<tr><td>${names[k]}</td><td>${extra[k] ?? ''}</td><td>×${h.f[k].toFixed(2)}</td></tr>`).join('');
}

// Chart geometry in CSS pixels; W follows the container so text stays 11px on phones.
let W = 720;
const H = 220, L = 8, R = 8, T = 10, B = 24;
const x = (t, t0) => L + ((t - t0) / HOUR / 23) * (W - L - R);
const y = (s) => T + (1 - s / 100) * (H - T - B);

function chart(hs) {
  W = Math.max(280, $('#detail').clientWidth);
  const t0 = Date.parse(new Date(hs[0].t).toISOString().slice(0, 10) + 'T00:00Z');
  const p = hs.map((h) => [x(h.t, t0), y(h.score)]);
  let line = `M${p[0]}`;
  for (let i = 1; i < p.length; i++) line += ` Q${p[i - 1]} ${(p[i - 1][0] + p[i][0]) / 2},${(p[i - 1][1] + p[i][1]) / 2}`;
  line += ` L${p.at(-1)}`;
  const area = `${line} L${p.at(-1)[0]},${y(0)} L${p[0][0]},${y(0)} Z`;
  const grid = [[35, 'низька'], [60, 'середня'], [80, 'висока']].map(([s, n]) =>
    `<line x1="${L}" x2="${W - R}" y1="${y(s)}" y2="${y(s)}" stroke="var(--grid)"/><text x="${L + 4}" y="${y(s) - 3}">${n}</text>`).join('');
  const ticks = [0, 3, 6, 9, 12, 15, 18, 21].map((k) =>
    `<text x="${x(t0 + k * HOUR, t0)}" y="${H - 6}" text-anchor="middle">${String(k).padStart(2, '0')}</text>`).join('');
  const day = new Date(t0).toISOString().slice(0, 10);
  const sun = [...data.sunrise, ...data.sunset].filter((t) => new Date(t).toISOString().startsWith(day)).map((t) =>
    `<line x1="${x(t, t0)}" x2="${x(t, t0)}" y1="${T}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>`).join('');
  const now = nowLocal >= t0 && nowLocal < t0 + 24 * HOUR
    ? (() => { const h = hs.reduce((a, b) => (Math.abs(b.t - nowLocal) < Math.abs(a.t - nowLocal) ? b : a));
        return `<circle cx="${x(nowLocal, t0)}" cy="${y(h.score)}" r="5" fill="var(--series)" stroke="var(--bg)" stroke-width="2"/>`; })()
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Оцінка по годинах">
    ${grid}${sun}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--grid)"/>
    <path d="${area}" fill="var(--wash)"/><path d="${line}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
    ${ticks}${now}<line id="cross" y1="${T}" y2="${y(0)}" stroke="var(--text-2)" stroke-width="1" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>`;
}

function bindHover(hs) {
  const svg = $('.chart svg'), tip = $('#tip'), cross = $('#cross');
  const t0 = Date.parse(new Date(hs[0].t).toISOString().slice(0, 10) + 'T00:00Z');
  svg.addEventListener('pointermove', (e) => {
    const box = svg.getBoundingClientRect();
    const vx = ((e.clientX - box.left) / box.width) * W;
    const h = hs.reduce((a, b) => (Math.abs(x(b.t, t0) - vx) < Math.abs(x(a.t, t0) - vx) ? b : a));
    const px = x(h.t, t0);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    tip.style.display = 'block';
    tip.textContent = `${hh(h.t)} · ${h.score} · вода ${fmt(h.waterTemp, '°')}`;
    tip.style.left = `${Math.min(Math.max(0, (px / W) * box.width - tip.offsetWidth / 2), box.width - tip.offsetWidth)}px`;
    showFactors(h);
  });
  svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
}

function setPlace(p) { place = p; store.set('place', p); $('#results').innerHTML = ''; load(); }

addEventListener('resize', () => daily.length && render());
$('#days').addEventListener('click', (e) => {
  const b = e.target.closest('.day');
  if (b) { selected = +b.dataset.i; render(); }
});
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.mode; store.set('mode', mode); load(); }));
$('#search').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  try {
    const r = await getJson(api('geocoding-api.open-meteo.com', 'search', { name: q, count: 6, language: 'uk' }));
    $('#results').innerHTML = (r.results ?? []).map((g, i) =>
      `<li><button data-i="${i}">${esc([g.name, g.admin1, g.country].filter(Boolean).join(', '))}</button></li>`).join('') || '<li>Нічого не знайдено</li>';
    $('#results').onclick = (ev) => {
      const g = r.results?.[ev.target.closest('button')?.dataset.i];
      if (g) setPlace({ name: [g.name, g.admin1].filter(Boolean).join(', '), lat: g.latitude, lon: g.longitude });
    };
  } catch (err) { status(`Пошук не вдався: ${err.message}`); }
});
$('#geo').addEventListener('click', () => navigator.geolocation?.getCurrentPosition(
  (p) => setPlace({ name: `Моє місце (${p.coords.latitude.toFixed(2)}, ${p.coords.longitude.toFixed(2)})`, lat: p.coords.latitude, lon: p.coords.longitude }),
  () => status('Геолокація недоступна'),
));

load();
</script>
</body>
</html>
